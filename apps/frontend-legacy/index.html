<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OIerDb LexRank · 分层优先排名</title>
    <meta
      name="description"
      content="OIerDb LexRank：OIerDb 的二次开发版本，使用「分层优先排名」——先比最高赛事层级，再比该层级上的最高奖项，最后看其余成绩。数据来自开源项目 OIerDb（AGPL-3.0）。"
    />
    <script>
      window.appVersion = '<%= appVersion %>';
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="<%= basePath %>apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= basePath %>favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= basePath %>favicon-16x16.png">
    <link rel="manifest" href="<%= basePath %>site.webmanifest">
    <link rel="mask-icon" href="<%= basePath %>safari-pinned-tab.svg" color="#a8a8a8">
    <meta name="msapplication-TileColor" content="#0d3f3b">
    <meta name="theme-color" content="#0d3f3b" />
    <meta rel="canonical" href="https://oier.baoshuo.dev" />
  </head>

  <body>
    <div id="app">
      <style>
        body {
          padding-top: 50px;
        }
      </style>

      <!-- header -->
      <div class="ui borderless top fixed menu" style="background: #0d3f3b">
        <div class="ui container">
          <a class="item" href="<%= basePath %>" style="color: #e6fffb">
            <span style="font-size: 20px; font-weight: 700">OIerDb</span>
            <% if (localPreview) { %><span
              style="
                margin-left: 0.5em;
                padding: 3px 7px;
                border-radius: 999px;
                background: #14b8a6;
                color: #052e2b;
                font-size: 11px;
                font-weight: 600;
              "
              >本地预览</span
            ><% } %>
          </a>
        </div>
      </div>

      <!-- loading -->
      <div class="ui container" style="padding: 1.5rem 1.5rem 0.5rem">
        <div class="ui segment" style="height: 100px">
          <div class="ui active transition visible inverted dimmer">
            <div class="content">
              <div class="ui medium text loader">Loading...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- footer -->
      <div class="ui vertical segment">
        <div class="ui center aligned container">
          <div style="color: #888; font-size: 0.8em">
            <code><%= appVersion.substring(0, 7) %></code>
            &nbsp;
            <a
              href="https://github.com/xiangyanhao/OIerDb-LexRank"
              title="本仓库源代码"
              target="_blank"
              rel="noreferrer noopener"
              style="color: inherit"
            >
              <i aria-hidden="true" class="github icon"></i>
              Source Code
            </a>
          </div>
          <div style="margin-top: 0.5rem; color: #14b8a6; font-size: 0.8em">
            OIerDb LexRank · 分层优先排名由 Yanhao Xiang 二次开发 · AGPL-3.0
          </div>
          <div style="margin-top: 0.75rem">
            Made with 💖 by
            <a
              href="https://baoshuo.ren/?utm_source=oier.baoshuo.dev"
              target="_blank"
              rel="noreferrer"
              >Baoshuo</a
            >,
            <a href="https://men.ci" target="_blank" rel="noreferrer">Menci</a>,
            <a href="https://bytew.net" target="_blank" rel="noreferrer"
              >nocriz</a
            >
            and
            <a
              href="https://github.com/yhx-12243"
              target="_blank"
              rel="noreferrer"
              >yhx-12243</a
            >
          </div>
          <div style="margin-top: 0.6rem; color: #888; font-size: 0.8em">
            源代码：<a href="https://github.com/xiangyanhao/OIerDb-LexRank" target="_blank" rel="noreferrer noopener" style="color: inherit">xiangyanhao/OIerDb-LexRank</a>
            · 上游项目：<a href="https://github.com/OIerDb-ng/OIerDb" target="_blank" rel="noreferrer noopener" style="color: inherit">OIerDb-ng/OIerDb</a>
            · 许可：<a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noreferrer noopener" style="color: inherit">AGPL-3.0</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
