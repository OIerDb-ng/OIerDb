name: deploy

on:
  push:
    branches:
      - master
    paths:
      - generator/**
      - data/**
      - package.json
      - yarn.lock
      - apps/frontend-legacy/**
      - .github/workflows/deploy.yml
  pull_request:
    branches:
      - master
    paths:
      - generator/**
      - data/**
      - package.json
      - yarn.lock
      - apps/frontend-legacy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    name: Build Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: generator

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore generated data cache
        id: data-cache
        uses: actions/cache@v6
        with:
          path: generator/.data-cache
          key: data-dist-${{ runner.os }}-${{ hashFiles('generator/*.py', 'generator/**/*.py', 'generator/requirements.txt', 'data/**') }}

      - name: Restore generated data files
        if: steps.data-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p dist
          cp .data-cache/static.json .data-cache/static.info.json \
            .data-cache/result.txt .data-cache/result.info.json dist/

      - name: Use Python 3
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Dependencies
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Build
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: python main.py --lex-rank

      - name: Save generated data files
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .data-cache
          cp dist/static.json dist/static.info.json \
            dist/result.txt dist/result.info.json .data-cache/

      - name: Rename Files
        run: |
          STATIC_SHA512=$(jq -r .sha512 dist/static.info.json)
          RESULT_SHA512=$(jq -r .sha512 dist/result.info.json)

          mv dist/static.json dist/static.${STATIC_SHA512:0:7}.json
          mv dist/result.txt  dist/result.${RESULT_SHA512:0:7}.txt

          ln -s static.info.json dist/static.sha512.json
          ln -s result.info.json dist/result.sha512.json

          ln -s static.${STATIC_SHA512:0:7}.json dist/static.json
          ln -s result.${RESULT_SHA512:0:7}.txt  dist/result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: data-dist
          path: generator/dist/
          retention-days: 1

  build-frontend:
    name: Build Frontend (legacy)
    needs: build-data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install Dependencies
        run: yarn install

      - name: Download Generated Data
        uses: actions/download-artifact@v8
        with:
          name: data-dist
          path: dist-data

      - name: Prepare Local Data
        run: |
          mkdir -p apps/frontend-legacy/public/data
          STATIC_SHA512=$(jq -r .sha512 dist-data/static.info.json)
          RESULT_SHA512=$(jq -r .sha512 dist-data/result.info.json)
          cp dist-data/static.info.json apps/frontend-legacy/public/data/static.info.json
          cp "dist-data/static.${STATIC_SHA512:0:7}.json" apps/frontend-legacy/public/data/
          cp dist-data/result.info.json apps/frontend-legacy/public/data/result.info.json
          cp "dist-data/result.${RESULT_SHA512:0:7}.txt" apps/frontend-legacy/public/data/

      - name: Build Site
        run: yarn workspace frontend-legacy build
        env:
          VITE_LOCAL_DATA: /OIerDb-LexRank/data
          BASE_PATH: /OIerDb-LexRank/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-legacy-dist
          path: apps/frontend-legacy/dist/
          retention-days: 1

      # Upload the Pages artifact in the build job (not the deploy job).
      # deploy-pages looks up "github-pages" by name; if upload and deploy
      # share one job, that lookup can race the artifact API and fail with
      # "No artifacts named github-pages were found" even after a successful
      # upload. Separating the jobs (needs:) gives the artifact time to become
      # visible, which is the layout GitHub's Pages starters use.
      - name: Upload Pages Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/frontend-legacy/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-frontend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  sync-cdn:
    name: Sync to CDN
    needs: build-data
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'OIerDb-ng/OIerDb'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: data-dist
          path: dist

      - name: Checkout renbaoshuo/cdn-sb
        uses: actions/checkout@v7
        with:
          repository: renbaoshuo/cdn-sb
          token: ${{ secrets.GH_TOKEN_CDN_SB }}
          path: cdn-sb

      - name: Copy Files
        run: |
          STATIC_SHA512=$(jq -r .sha512 dist/static.info.json)
          RESULT_SHA512=$(jq -r .sha512 dist/result.info.json)

          rm -rf cdn-sb/public/oier
          mkdir -p cdn-sb/public/oier

          cp dist/static.${STATIC_SHA512:0:7}.json cdn-sb/public/oier/static.${STATIC_SHA512:0:7}.json
          cp dist/result.${RESULT_SHA512:0:7}.txt  cdn-sb/public/oier/result.${RESULT_SHA512:0:7}.txt

      - id: get-commit-sha
        run: |
          id="${{ github.sha }}"
          echo "id=${id:0:7}" >> $GITHUB_OUTPUT

      - name: Upload
        run: |
          cd cdn-sb
          git config --global user.name BaoshuoBot
          git config --global user.email bot@baoshuo.dev
          git add public/oier
          git commit -m "[OIerDb/${{ steps.get-commit-sha.outputs.id }}] Upload dist on $(date '+%Y-%m-%d %H:%M:%S')" --allow-empty
          git push

  deploy-server:
    name: Deploy to Server
    needs: [build-data, build-frontend, sync-cdn]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'OIerDb-ng/OIerDb'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Data Artifact
        uses: actions/download-artifact@v8
        with:
          name: data-dist
          path: dist-data

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-legacy-dist
          path: dist-frontend

      - name: Deploy data to server (Tokyo, JP)
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          ARGS: '-avz --delete'
          SOURCE: dist-data/
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: ${{ secrets.REMOTE_PATH_2 }}
          EXCLUDE: .git,.github,.gitlab-ci.yml,.nojekyll

      - name: Deploy site to server (Tokyo, JP)
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          ARGS: '-avz --delete'
          SOURCE: dist-frontend/
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: ${{ secrets.REMOTE_PATH }}
          EXCLUDE: .git,.github,.gitlab-ci.yml,.nojekyll
