name: Classify issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to review
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-classify-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && github.event.issue.user.type != 'Bot' &&
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || github.event.comment.user.type == 'User'))
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r generator/requirements.txt

      - name: Create oierdb-bot installation token
        id: oierdb-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OIERDB_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OIERDB_BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Classify issue and propose repairs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OIERDB_BOT_TOKEN: ${{ steps.oierdb-bot-token.outputs.token }}
          OIERDB_BOT_SLUG: ${{ steps.oierdb-bot-token.outputs.app-slug }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          : "${OIERDB_BOT_TOKEN:?Missing oierdb-bot installation token}"
          python generator/tools/issue_classify.py --issue-number "$ISSUE_NUMBER" --plan-repair
