name: Classify issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to review
        required: true
        type: string
      dry_run:
        description: Preview changes without updating the issue
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-classify-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.state == 'open' && github.event.issue.user.type != 'Bot')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r generator/requirements.txt

      - name: Classify issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          APPLY: ${{ github.event_name == 'issues' || !inputs.dry_run }}
        run: |
          args=(--issue-number "$ISSUE_NUMBER")
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python generator/tools/issue_classify.py "${args[@]}"
